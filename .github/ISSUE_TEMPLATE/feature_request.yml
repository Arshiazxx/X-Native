name: Feature request
description: Suggest an improvement or a new capability for X-Native.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        X-Native is an early-stage research project. The constraints of the
        Xbox Dev Mode (UWP) sandbox shape what is possible — see
        docs/compatibility.md for what the platform allows and forbids
        today. Requests that engage with those constraints are the most
        useful kind.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation or limitation, not just the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like X-Native to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why they fall short.
    validations:
      required: false
